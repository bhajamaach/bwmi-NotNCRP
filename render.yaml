databases:
  - name: notncrp-db
    plan: 0.1c-256mb
    databaseName: notncrp
    user: notncrp

services:
  - type: web
    name: notncrp-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notncrp-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://notncrp-web.onrender.com
      - key: PORT
        value: 4000

  - type: web
    name: notncrp-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://notncrp-api.onrender.com
