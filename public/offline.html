<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Offline — NotNCRP</title>
<style>
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:#F4F5F7; color:#14161A; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:420px; text-align:center; background:#fff; border:1px solid #D7DBE1; border-radius:12px; padding:32px 24px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:#4B5058; line-height:1.6; margin:0 0 20px; }
  button { background:#0B3D91; color:#fff; border:none; border-radius:10px; padding:12px 20px; font-size:15px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>NotNCRP needs a connection to load a page for the first time. Once you've opened a page before, this install can serve it again — but the connection dropped before that happened here.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
